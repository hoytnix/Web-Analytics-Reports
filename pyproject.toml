[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-report"
version = "2.0.0"
description = "Modular Cloudflare & Vercel Portfolio Analytics Reporting Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Michael Hoyt"}
]
dependencies = [
    "requests>=2.28.0",
    "Jinja2>=3.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=60.0",
]

[project.scripts]
cf-report = "cf_report.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cf_report*"]

[tool.setuptools.package-data]
cf_report = ["templates/*.j2"]
